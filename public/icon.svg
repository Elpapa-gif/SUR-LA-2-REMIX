<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Neon Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Lightning Bolt Icon -->
  <path d="M280 64L144 288H264L232 448L368 224H248L280 64Z"
        fill="url(#bolt)"
        filter="url(#glow)" />

  <!-- Number "2" Badge -->
  <circle cx="380" cy="380" r="64" fill="#10B981" filter="url(#glow)" />
  <text x="380" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#0B0F19" text-anchor="middle">2</text>
</svg>
